# Copies the newest SovraHarness installers here for existing mirror links.
# The download site follows the official SovraHarness release directly.
#
# Runs on a schedule and on demand. A version already mirrored is skipped, and a
# SovraHarness release that does not yet have all three installers is skipped
# until it does.
name: Mirror latest release

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: SovraHarness tag to mirror (blank = newest release)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Mirror installers
        env:
          SOURCE_REPO: Sovra-AI/SovraHarness
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          publish() {
            # A manual backfill of an older tag must preserve the current download.
            local newest latest=false
            newest=$(gh release view --repo "$SOURCE_REPO" --json tagName --jq .tagName)
            if [[ "$tag" == "$newest" ]]; then latest=true; fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          }

          source_latest=$(gh release view --repo "$SOURCE_REPO" --json tagName --jq .tagName)
          tag="${INPUT_TAG:-$source_latest}"
          echo "Source release: $tag"

          # Site asset name  <-  source asset name
          declare -A wanted=(
            [SovraHarness-osx-Setup.pkg]=SovraHarness-osx-Setup.pkg
            [SovraHarness-win-Setup.exe]=SovraHarness-win-Setup.exe
            [SovraHarness.AppImage]=SovraHarness.AppImage
          )

          src_assets=$(gh release view "$tag" --repo "$SOURCE_REPO" --json assets --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name')
          for name in "${wanted[@]}"; do
            if ! grep -Fxq -- "$name" <<< "$src_assets"; then
              echo "$tag does not have $name yet; nothing to mirror."
              exit 0
            fi
          done

          if mine=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft 2>/dev/null); then
            names=$(jq -r '.assets[] | select(.state == "uploaded" and .size > 0) | .name' <<< "$mine")
            complete=1
            for site_name in "${!wanted[@]}"; do
              grep -Fxq -- "$site_name" <<< "$names" || complete=0
            done
            if [[ "$complete" == "1" ]]; then
              if [[ "$(jq -r .isDraft <<< "$mine")" == true ]]; then
                publish
              elif [[ "$tag" == "$source_latest" ]]; then
                site_latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
                if [[ "$site_latest" != "$tag" ]]; then publish; fi
              fi
              echo "$tag is mirrored."
              exit 0
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "SovraHarness $tag installers" \
              --notes "Installers for SovraHarness $tag (macOS, Windows, Linux)." \
              --draft
          fi

          mkdir -p dl
          for site_name in "${!wanted[@]}"; do
            gh release download "$tag" --repo "$SOURCE_REPO" --pattern "${wanted[$site_name]}" --dir dl --clobber
            if [[ "$site_name" != "${wanted[$site_name]}" ]]; then
              mv "dl/${wanted[$site_name]}" "dl/$site_name"
            fi
          done
          ls -la dl
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dl/*

          # Publish and mark latest only once all three are attached, so the
          # site never points at a half-uploaded release.
          publish
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[]|{name,size}'
